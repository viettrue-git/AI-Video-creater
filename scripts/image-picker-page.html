<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn ảnh shot</title>
<style>
  :root { --bg: #16181d; --card: #22252c; --text: #e8e8e8; --muted: #9aa0a6; --accent: #3ddc84; --warn: #f5a623; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; padding: 16px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 8px 0 12px; z-index: 2;
           display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #333; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: var(--muted); }
  button { background: var(--accent); color: #000; border: 0; border-radius: 8px; padding: 10px 18px;
           font-weight: 600; cursor: pointer; }
  button.secondary { background: #444; color: var(--text); padding: 6px 12px; font-weight: 500; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .shot { background: var(--card); border-radius: 12px; margin: 16px 0; padding: 12px; }
  .shot.done { outline: 2px solid var(--accent); }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .meta b { color: var(--accent); }
  .narr { color: var(--muted); font-style: italic; }
  .row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .row img { height: 320px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; flex: none; }
  .row img.ref { cursor: default; opacity: .85; border-color: #555; }
  .row img.picked { border-color: var(--accent); }
  .empty { color: var(--warn); padding: 20px; }
  @media (max-width: 600px) { .row img { height: 220px; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="status"></span>
  <span style="color: var(--warn)">Bấm vào ảnh = CHỌN ảnh đó (viền xanh). Muốn xem to: chuột phải → mở ảnh trong tab mới.</span>
  <button id="done">Xong — render video</button>
</header>
<main id="shots"></main>
<script>
const DATA = __DATA__;
const img = p => `/img?p=${encodeURIComponent(p)}`;
const post = (url, body) => fetch(url, {method: "POST", body: JSON.stringify(body || {})});

function render() {
  document.getElementById("title").textContent = `${DATA.project} — ${DATA.title}`;
  const main = document.getElementById("shots");
  main.innerHTML = "";
  for (const s of DATA.shots) {
    const box = document.createElement("section");
    box.className = "shot" + (s.picked ? " done" : "");
    // build with textContent (not innerHTML) so script text can never inject markup
    const meta = document.createElement("div"), info = document.createElement("div");
    const idEl = document.createElement("b"), narr = document.createElement("div");
    meta.className = "meta"; narr.className = "narr";
    idEl.textContent = s.id; narr.textContent = `“${s.narration}”`;
    info.append(idEl, ` — ${s.description}`, narr); meta.appendChild(info); box.appendChild(meta);
    const reroll = document.createElement("button");
    reroll.className = "secondary";
    reroll.textContent = "Chưa ưng — tạo thêm 4 ảnh";
    reroll.onclick = async () => { await post("/reroll", {shot: s.id}); s.picked = null; s.rerolled = true; render(); };
    box.querySelector(".meta").appendChild(reroll);
    const row = document.createElement("div");
    row.className = "row";
    const ref = document.createElement("img");
    ref.src = img(DATA.ref); ref.className = "ref"; ref.title = "Ảnh tham chiếu nhân vật";
    row.appendChild(ref);
    if (s.rerolled) row.insertAdjacentHTML("beforeend", `<div class="empty">Sẽ tạo thêm ảnh cho shot này rồi mở lại trang.</div>`);
    for (const c of s.candidates) {
      const el = document.createElement("img");
      el.src = img(c); el.title = c.split("/").pop();
      if (c === s.picked) el.className = "picked";
      el.onclick = async () => { await post("/pick", {shot: s.id, image: c}); s.picked = c; s.rerolled = false; render(); };
      row.appendChild(el);
    }
    box.appendChild(row);
    main.appendChild(box);
  }
  const picked = DATA.shots.filter(s => s.picked).length;
  document.getElementById("status").textContent = `Đã chọn ${picked}/${DATA.shots.length} shot`;
  const done = document.getElementById("done");
  // always clickable: unpicked shots get more images (a reload must not lock the page after "tạo thêm")
  done.disabled = false;
  done.textContent = picked === DATA.shots.length ? "Xong — render video" : "Xong — tạo thêm ảnh cho shot chưa chọn";
}
document.getElementById("done").onclick = async () => {
  await post("/done");
  document.body.innerHTML = "<h1 style='padding:40px'>Đã lưu. Có thể đóng tab này — máy đang chạy tiếp.</h1>";
};
render();
</script>
</body>
</html>
